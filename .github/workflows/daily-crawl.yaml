name: Daily Collection

# Dual insurance (no LLM): cloud crawl at Beijing 23:00 (UTC 15:00).
# Local Mac launchd is a boot-time supplement — see scripts/macos/.
# This workflow only crawls + rule-clean + dedup + digest. No generate/publish/push.
#
# Root cause of historical GHA failures (e.g. run 31615607142): a single job
# bound full pytest / Playwright browsers / generate / publish BEFORE crawl,
# so an unrelated test failure skipped the crawler. Collect is now independent
# of contract-check; Playwright browsers are never installed here.

on:
  schedule:
    - cron: '0 15 * * *'   # UTC 15:00 = 北京每天 23:00
  workflow_dispatch:
    inputs:
      date:
        description: 'Collection date (YYYY-MM-DD), defaults to Asia/Shanghai today'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install collection dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          attempt=1
          max=3
          while [ "$attempt" -le "$max" ]; do
            if pip install -r requirements.txt; then
              exit 0
            fi
            echo "pip install attempt ${attempt}/${max} failed" >&2
            if [ "$attempt" -eq "$max" ]; then
              exit 1
            fi
            sleep $((attempt * 8))
            attempt=$((attempt + 1))
          done

      - name: Resolve collection date
        id: report-date
        timeout-minutes: 2
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          DATE="${INPUT_DATE:-}"
          if [ -z "$DATE" ] || ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d || date -u +%Y-%m-%d || true)
          fi
          if [ -z "$DATE" ]; then
            echo "date=" >> "$GITHUB_OUTPUT"
            echo "artifact_name=daily-collection-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$DATE" >> "$GITHUB_OUTPUT"
            echo "artifact_name=daily-collection-${DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cross-run dedup state
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: data/state
          key: crawl-state-${{ runner.os }}-${{ steps.report-date.outputs.date || github.run_id }}-${{ github.run_id }}
          restore-keys: |
            crawl-state-${{ runner.os }}-

      - name: Crawl local-only (no LLM / no remote store)
        id: crawl
        timeout-minutes: 60
        env:
          COLLECTION_DATE: ${{ steps.report-date.outputs.date }}
        run: |
          set -euo pipefail
          DATE="${COLLECTION_DATE:-}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d || date -u +%Y-%m-%d)
          fi
          python main.py --local-only --date "$DATE"

      - name: Collection health gate and summary
        if: always()
        timeout-minutes: 5
        run: python scripts/check_collection_health.py --logs-dir logs

      - name: Upload crawl artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report-date.outputs.artifact_name || format('daily-collection-{0}', github.run_id) }}
          path: |
            data/
            logs/
          if-no-files-found: warn
          retention-days: 14

  contract-check:
    # Parallel, optional for collect: failures are visible but never skip crawl.
    # continue-on-error keeps the workflow conclusion aligned with collect.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install smoke test dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          attempt=1
          max=3
          while [ "$attempt" -le "$max" ]; do
            if pip install -r requirements.txt; then
              exit 0
            fi
            echo "pip install attempt ${attempt}/${max} failed" >&2
            if [ "$attempt" -eq "$max" ]; then
              exit 1
            fi
            sleep $((attempt * 8))
            attempt=$((attempt + 1))
          done

      - name: Collection contract smoke
        timeout-minutes: 5
        run: >
          python -m pytest -q
          tests/test_daily_collection_contract.py
          tests/test_collection_health.py
