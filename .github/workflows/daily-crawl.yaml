name: Daily Pipeline

on:
  schedule:
    - cron: '0 15 * * *'   # UTC 15:00 = 北京每天 23:00
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date (YYYY-MM-DD), defaults to today'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
      # Agnes image generation deprecated — do not inject AGNES_* for production media.
      WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
      WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
      ZEROREALM_LOCAL_IMAGE_CMD: ${{ vars.ZEROREALM_LOCAL_IMAGE_CMD || '' }}
      SYNC_PUBLIC_BUNDLE: ${{ vars.SYNC_PUBLIC_BUNDLE || 'true' }}
      SYNC_LEGACY_DAILY_MDX: ${{ vars.SYNC_LEGACY_DAILY_MDX || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Resolve report date
        id: report-date
        shell: bash
        run: |
          DATE="${{ inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Restore cross-run dedup state
        uses: actions/cache@v4
        with:
          path: data/state
          key: crawl-state-${{ runner.os }}-${{ steps.report-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            crawl-state-${{ runner.os }}-

      - name: Restore generated media and draft state
        uses: actions/cache@v4
        with:
          path: |
            assets/generated
            storage/manifest
          key: publish-state-${{ runner.os }}-${{ steps.report-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            publish-state-${{ runner.os }}-${{ steps.report-date.outputs.date }}-
            publish-state-${{ runner.os }}-

      - name: Checkout website history
        if: env.WEBSITE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: LoganWang123/zerorealm-website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Run crawler
        run: python main.py --date "${{ steps.report-date.outputs.date }}"
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat

      - name: Generate daily report
        id: generate
        shell: bash
        run: |
          set +e
          HISTORY_ARGS=()
          if [ -d website/content/daily ]; then
            HISTORY_ARGS=(--history-dir website/content/daily)
          fi
          python generate_daily.py \
            --date "${{ steps.report-date.outputs.date }}" \
            "${HISTORY_ARGS[@]}"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat

      - name: Website sync configuration warning
        if: env.WEBSITE_REPO_TOKEN == ''
        run: echo "::warning::WEBSITE_REPO_TOKEN is not configured; report was not synced to the website."

      - name: Export and validate Public Bundle v1
        id: public-bundle
        shell: bash
        run: |
          python scripts/export_public_bundle.py \
            --input data/research/public-catalog.json \
            --output dist/public-v1 \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          HASH=$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist/public-v1/manifest.json").read_text(encoding="utf-8"))
          print(manifest["bundleHash"])
          PY
          )
          echo "bundle_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Generate local publishing images (no Agnes)
        if: env.WEBSITE_REPO_TOKEN != '' && steps.generate.outputs.generated == 'true'
        id: media
        continue-on-error: true
        run: python publish.py --channel wechat --date "${{ steps.report-date.outputs.date }}" --dry-run

      - name: Publish report, images, and Public Bundle to website
        if: env.WEBSITE_REPO_TOKEN != '' && (steps.generate.outputs.generated == 'true' || env.SYNC_PUBLIC_BUNDLE == 'true')
        shell: bash
        run: |
          DATE="${{ steps.report-date.outputs.date }}"
          BUNDLE_HASH="${{ steps.public-bundle.outputs.bundle_hash }}"
          git -C website config user.name "LoganWang123"
          git -C website config user.email "LoganWang123@users.noreply.github.com"

          if [ "${SYNC_LEGACY_DAILY_MDX}" = "true" ] && [ "${{ steps.generate.outputs.generated }}" = "true" ]; then
            REPORT="output_daily/${DATE}.mdx"
            test -f "$REPORT"
            install -D -m 0644 "$REPORT" "website/content/daily/${DATE}.mdx"
            MEDIA_DIR="assets/generated/${DATE}"
            # Media may be pending_local_generation; sync only when local files exist.
            if [ -f "${MEDIA_DIR}/cover.png" ] && [ -f "${MEDIA_DIR}/body-1.png" ] && [ -f "${MEDIA_DIR}/body-2.png" ] && [ -f "${MEDIA_DIR}/body-3.png" ]; then
              install -D -m 0644 "${MEDIA_DIR}/cover.png" "website/public/media/daily/${DATE}/cover.png"
              install -D -m 0644 "${MEDIA_DIR}/body-1.png" "website/public/media/daily/${DATE}/body-1.png"
              install -D -m 0644 "${MEDIA_DIR}/body-2.png" "website/public/media/daily/${DATE}/body-2.png"
              install -D -m 0644 "${MEDIA_DIR}/body-3.png" "website/public/media/daily/${DATE}/body-3.png"
              git -C website add "public/media/daily/${DATE}"
            else
              echo "::warning::Local media incomplete for ${DATE}; prompt packages may be under dist/media-jobs/"
            fi
            python - <<'PY'
          import json
          from pathlib import Path

          stats_path = Path("website/data/stats.json")
          stats = json.loads(stats_path.read_text(encoding="utf-8"))
          stats["dailyIssues"] = len(list(Path("website/content/daily").glob("*.mdx")))
          stats_path.write_text(
              json.dumps(stats, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            git -C website add "content/daily/${DATE}.mdx" "data/stats.json"
          fi

          if [ "${SYNC_PUBLIC_BUNDLE}" = "true" ]; then
            rm -rf website/data/public-v1
            mkdir -p website/data/public-v1
            cp -a dist/public-v1/. website/data/public-v1/
            git -C website add data/public-v1
          fi

          if git -C website diff --cached --quiet; then
            echo "No website changes to commit"
          else
            git -C website commit -m "feat(content): sync ${DATE} bundle ${BUNDLE_HASH}"
            git -C website push
          fi

      - name: Verify production report and images
        if: env.WEBSITE_REPO_TOKEN != '' && steps.generate.outputs.generated == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import re
          import time
          from pathlib import Path

          import requests

          date = "${{ steps.report-date.outputs.date }}"
          report = Path(f"output_daily/{date}.mdx").read_text(encoding="utf-8")
          match = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', report, re.MULTILINE)
          if not match:
              raise SystemExit("Report title is missing")
          title = match.group(1)
          urls = [
              f"https://zerorealm.tech/daily/{date}",
              *[
                  f"https://zerorealm.tech/media/daily/{date}/{name}.png"
                  for name in ("cover", "body-1", "body-2", "body-3")
              ],
          ]
          deadline = time.monotonic() + 600
          last_error = "deployment not checked"
          while time.monotonic() < deadline:
              try:
                  responses = [requests.get(url, timeout=20) for url in urls]
                  page = responses[0]
                  if all(response.status_code == 200 for response in responses):
                      if title in page.text and date in page.text:
                          break
                  last_error = ", ".join(
                      f"{url}={response.status_code}"
                      for url, response in zip(urls, responses)
                  )
              except requests.RequestException as exc:
                  last_error = str(exc)
              time.sleep(15)
          else:
              raise SystemExit(f"Production verification failed: {last_error}")
          PY

      - name: Create or update verified WeChat draft
        if: env.WEBSITE_REPO_TOKEN != '' && steps.generate.outputs.generated == 'true' && steps.media.outcome == 'success'
        run: python publish.py --channel wechat --date "${{ steps.report-date.outputs.date }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-${{ github.run_number }}
          path: |
            data/
            output_daily/
            assets/generated/
            storage/manifest/
            dist/public-v1/
            logs/
          retention-days: 30
