name: Daily Collection

# Dual insurance (no LLM): cloud crawl at Beijing 23:00 (UTC 15:00).
# Local Mac launchd is a boot-time supplement — see scripts/macos/.
# This workflow only crawls + rule-clean + dedup + digest. No generate/publish/push.

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Collection date (YYYY-MM-DD), defaults to Asia/Shanghai today'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install collection dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            pip install -r requirements.txt && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done

      - name: Resolve collection date
        id: report-date
        timeout-minutes: 2
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          DATE="${INPUT_DATE:-}"
          if [ -z "$DATE" ] || ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d || date -u +%Y-%m-%d || true)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=daily-collection-${DATE:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Restore cross-run dedup state
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: data/state
          key: crawl-state-${{ runner.os }}-${{ steps.report-date.outputs.date || github.run_id }}-${{ github.run_id }}
          restore-keys: |
            crawl-state-${{ runner.os }}-

      - name: Crawl local-only (no LLM / no remote store)
        id: crawl
        timeout-minutes: 60
        env:
          COLLECTION_DATE: ${{ steps.report-date.outputs.date }}
        run: |
          set -euo pipefail
          DATE="${COLLECTION_DATE:-$(TZ=Asia/Shanghai date +%Y-%m-%d)}"
          python main.py --local-only --date "$DATE"

      - name: Collection health gate and summary
        if: always()
        timeout-minutes: 5
        run: python scripts/check_collection_health.py --logs-dir logs

      - name: Upload crawl artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report-date.outputs.artifact_name || format('daily-collection-{0}', github.run_id) }}
          path: |
            data/
            logs/
          if-no-files-found: warn
          retention-days: 14

  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install smoke test dependencies
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Collection contract smoke
        timeout-minutes: 5
        run: >
          python -m pytest -q
          tests/test_daily_collection_contract.py
          tests/test_collection_health.py
