name: Daily Pipeline

on:
  schedule:
    - cron: '0 15 * * *'   # UTC 15:00 = 北京 23:00 采集
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date (YYYY-MM-DD), defaults to today'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Resolve report date
        id: report-date
        shell: bash
        run: |
          DATE="${{ inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Restore cross-run dedup state
        uses: actions/cache@v4
        with:
          path: data/state
          key: crawl-state-${{ runner.os }}-${{ steps.report-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            crawl-state-${{ runner.os }}-

      - name: Checkout website history
        if: env.WEBSITE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: LoganWang123/zerorealm-website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Run crawler
        run: python main.py --date "${{ steps.report-date.outputs.date }}"
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat

      - name: Generate daily report
        id: generate
        shell: bash
        run: |
          set +e
          HISTORY_ARGS=()
          if [ -d website/content/daily ]; then
            HISTORY_ARGS=(--history-dir website/content/daily)
          fi
          python generate_daily.py \
            --date "${{ steps.report-date.outputs.date }}" \
            "${HISTORY_ARGS[@]}"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-${{ github.run_number }}
          path: |
            data/
            output_daily/
            logs/
          retention-days: 30

      - name: Website sync configuration warning
        if: env.WEBSITE_REPO_TOKEN == ''
        run: echo "::warning::WEBSITE_REPO_TOKEN is not configured; report was not synced to the website."

      - name: Publish report to website
        if: env.WEBSITE_REPO_TOKEN != '' && steps.generate.outputs.generated == 'true'
        shell: bash
        run: |
          DATE="${{ steps.report-date.outputs.date }}"
          REPORT="output_daily/${DATE}.mdx"
          test -f "$REPORT"
          install -D -m 0644 "$REPORT" "website/content/daily/${DATE}.mdx"
          python - <<'PY'
          import json
          from pathlib import Path

          stats_path = Path("website/data/stats.json")
          stats = json.loads(stats_path.read_text(encoding="utf-8"))
          stats["dailyIssues"] = len(list(Path("website/content/daily").glob("*.mdx")))
          stats_path.write_text(
              json.dumps(stats, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git -C website config user.name "LoganWang123"
          git -C website config user.email "LoganWang123@users.noreply.github.com"
          git -C website add "content/daily/${DATE}.mdx" "data/stats.json"
          git -C website diff --cached --quiet || git -C website commit -m "feat(daily): publish ${DATE}"
          git -C website push
