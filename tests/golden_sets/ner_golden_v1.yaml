# NER Golden Set — 标注数据
# 用于评估 NER 抽取准确率（Precision / Recall / F1）
# 格式：每条包含 input（标题+摘要）和 expected（期望实体/事件）

cases:
  - id: gs_001
    input:
      title: "友宝在线完成C轮融资，估值超50亿元"
      source: "36kr_rss"
      summary: "友宝在线宣布完成C轮融资，由某知名投资机构领投。"
    expected:
      entities:
        - text: "友宝"
          type: "company"
      events:
        - type: "financing"
          subject: "友宝"

  - id: gs_002
    input:
      title: "丰e足食与美团达成战略合作，入驻美团平台"
      source: "fengzu_web"
      summary: "丰e足食宣布与美团达成战略合作，其自助智能零售终端将全面入驻美团。"
    expected:
      entities:
        - text: "丰e足食"
          type: "company"
        - text: "美团"
          type: "company"
      events:
        - type: "cooperation"
          subject: "丰e足食"

  - id: gs_003
    input:
      title: "九部门联合发布零售业创新发展顶层设计"
      source: "ccfa_web"
      summary: "商务部等9部门联合印发《关于加快零售业创新发展的意见》。"
    expected:
      entities:
        - text: "商务部"
          type: "company"
      events:
        - type: "policy"
          subject: "商务部"

  - id: gs_004
    input:
      title: "元气森林发布新品，进军即饮咖啡赛道"
      source: "genki_web"
      summary: "元气森林推出全新即饮咖啡产品线。"
    expected:
      entities:
        - text: "元气森林"
          type: "company"
      events:
        - type: "product_launch"
          subject: "元气森林"

  - id: gs_005
    input:
      title: "商汤科技发布新一代视觉识别芯片"
      source: "sensetime_web"
      summary: "商汤科技发布面向零售场景的新一代AI视觉识别芯片。"
    expected:
      entities:
        - text: "商汤"
          type: "company"
        - text: "视觉识别"
          type: "technology"
      events:
        - type: "product_launch"
          subject: "商汤"

  - id: gs_006
    input:
      title: "智能柜行业迎来爆发期，2026年市场规模预计突破百亿"
      source: "linkshop_web"
      summary: "智能柜市场在2026年迎来爆发期，市场规模预计突破百亿元。"
    expected:
      entities:
        - text: "智能柜"
          type: "product"
      events: []

  - id: gs_007
    input:
      title: "可口可乐加码在华投资，西部中原沿海布局升级"
      source: "cocacola_web"
      summary: "可口可乐宣布加大在华投资，升级西部、中原及沿海地区的生产与分销布局。"
    expected:
      entities:
        - text: "可口可乐"
