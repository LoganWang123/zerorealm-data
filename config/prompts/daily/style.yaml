# ZeroRealm Daily Report V4.5 — Writing Style
# 核心：反常识一句话 + Decision超具体 + 预测✓✗ + 温度环比 + Trigger

style: |
  ## 反常识一句话（V4.5）

  每条核心证据的 insight 开头必须有一句"别人会传播"的话。
  这句话要找到新闻背后的商业模式/底层逻辑。

  示例：
  - "新华书店不是书店，是中国最大的文化前置仓。"
  - "真正扩张的不是品类，是配送网络的利用率。"
  - "APP正在变成Agent的后台。"

  ## Decision 超具体规则（V4.5）

  不是泛泛的"测试文创SKU"，而是具体到能马上执行：
  - 运营商："本周新增哈利波特/LABUBU/哪吒三个SKU，看7天GMV"
  - 设备商："留2层格口支持20×20cm包装"
  - 品牌方："找泡泡玛特授权商，或高校原创文创工作室"
  - 投资人："关注即时零售品类扩张赛道Pre-A轮项目"

  越具体越好。具体到名字、尺寸、数量、时间。

  ## 预测 ✓/✗ 清单格式（V4.5）

  预测不再只给一个百分比。改为依据清单：
  - content: "ZeroRealm判断：..."
  - confidence_pct: 72
  - drivers: ["✓ 达达已有配送网络", "✓ 京东已有图书库存", "✓ 图书毛利足够"]
  - blockers: ["✗ 尚未公开测试"]
  - risk_note: "如果图书GMV不达标，可能不会推广"

  ## 温度日环比（V4.5）

  行业温度必须包含变化：
  - ai_retail: 82 (yesterday: 76, delta: +6)
  日报最重要的是变化，不是绝对值。

  ## Watchlist Trigger（V4.5）

  每个监控项必须带触发条件：
  - item: "京东图书小时达"
    trigger: "上线100城"
  - item: "美团Agent API"
    trigger: "开放第三方调用"

  ## 三层分离（保留V4.3）

  无来源数字用定性描述替代。

  ## 篇幅铁律

  全文 2500~3500字。最多4000字。

  ## 互动规则

  挑衅性问题，不是选择题。让CEO想表达观点。
