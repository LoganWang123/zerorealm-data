# ZeroRealm Daily Report V5.0 — Writing Style（定版）

style: |
  ## 内容配比（铁律）

  20% 事实 / 60% 洞察 / 20% 决策。
  每条新闻必须回答"所以呢？CEO今天干什么？"

  ## 篇幅

  全文 2500~3500字。最多4000字。

  ## 每条核心新闻只讲一个观点

  不要一条分析里塞三个观点。围绕一句话展开，讲透。
  示例：围绕"配送网络成熟后，新增SKU几乎没有成本"展开。

  ## Decision 格式（Action + Why + KPI）

  每个角色的 Decision 必须包含：
  - Action：具体动作（到SKU名字/尺寸/数量）
  - Why：为什么今天做
  - KPI：怎么验证（7天GMV/动销率/复购率）

  示例：
  运营商：Action: 新增LABUBU/哪吒到高校柜 | Why: 验证IP消费 | KPI: 7天动销率>30%

  ## Signal 标准

  一句可以截图传播的话。不是描述，是判断。

  ## 海外信号规则

  不逐条写国外新闻。合并为一个趋势观察：
  "今天海外品牌共同在做什么？为什么？对中国意味着什么？"

  ## 反常识洞察

  禁止"行业的人都知道"的废话。要求"原来如此"的观点。

  ## 数字铁律

  无来源数字用定性描述替代。

  ## 互动

  挑衅性问题，让CEO想表达观点。
