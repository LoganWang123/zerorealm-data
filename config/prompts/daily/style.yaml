# ZeroRealm Operator Brief V11.0 — 写作规范

style: |
  ## 篇幅与节奏

  全文 900~1400 个中文字符，最多 1600 字。
  开头 120 字内回答：
  1. 发生了什么
  2. 影响哪个经营指标
  3. 运营商今天先检查什么

  ## 核心故事

  核心故事依次写：
  - 事实：主体、动作、时间、直接来源
  - 影响：只推演一层，落到具体经营指标
  - 行动：一个低成本动作
  - 验证：一个 KPI 和一个停止条件

  不同时给设备商、品牌方和投资人建议。
  不堆砌“闭环、赋能、重塑、颠覆、生态”等抽象词。
  不把“使用过AI硬件”改写成“AI已成为日常”。
  不把可能性改写成已经发生的事实。

  ## 补充信号

  每条不超过 100 字，只说明其与核心经营问题的直接关系。
  如果关系需要两次以上跳跃推理，删除该信号。

  ## 数字与来源

  素材没有给出的数字一律不补写。
  每个 section 必须保留素材中的直接 HTTP(S) 原文链接；
  媒体首页、搜索页、空链接不视为直接来源。

  ## 标题与连续性

  标题不得使用“日报”“早报”“晚报”等汇总型词语，不使用期号。
  标题必须让读者看见一个具体经营对象、一个已发生变化和一个待检查指标。
  如果核心主体或核心动作与最近 3 期相同，必须换选题；不得只换标题措辞。
