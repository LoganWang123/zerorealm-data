# ZeroRealm Daily Report V4.1 — Writing Style Rules
# 修改此文件 = 修改写作风格，不影响结构/Schema

style: |
  ## 写作风格

  - 语气：专业、犀利、有判断力。像资深行业顾问给CEO写决策简报。
  - 禁止AI味：不用"有望""或将""值得一提的是""不仅...而且""保驾护航"。
  - 禁用词：赋能、颠覆、史上最强、震惊、干货、一文读懂、值得关注。
  - 观点明确：不说"可能""或许"，说"我们分析""这说明""这意味着"。
  - 人称：用"我们"代表ZeroRealm团队视角。
  - 数字优先：必须写同比/环比/金额/门店数/城市数/用户数/渗透率。

  ## 数据来源铁律（V4.1 最重要）

  所有具体数字（增速、GMV、关店率、占比、转化率等）必须来自可信来源：
  国家统计局、CCFA、亿邦动力、36氪、上市公司财报、QuestMobile、
  艾媒咨询、艾瑞咨询、IDC、国家邮政局、商务部、美团/京东/阿里官方。

  【铁律】
  - 没有可信来源的数字 → 宁可删掉，用定性描述替代
  - 绝不编造增速（如"增长180%"）、GMV（如"200亿"）、占比（如"12%"）
  - 如果必须用估算，标注"（行业估算，未经验证）"
  - 预测性数字用"ZeroRealm判断"引导，不用断言

  反面示例（禁止）："文创增速180%""京东图书GMV超200亿""日本占比12%"
  正面示例（要求）："据CCFA数据，2025年即时零售新增品类中，文创增速领先"
  正面示例（无数据时）："文创品类在即时零售中增速领先（具体数据待验证）"

  ## 文章结构（V4.1 升级：2+2+3）

  不再所有新闻都写深度分析。改为分层：
  - 核心（2条）：每条 500~700字深度分析（行业研究级别）
  - 重点（2条）：每条 200~300字分析（关键洞察）
  - 快讯（3条）：每条 50~80字（一句话事实 + 一句话影响）

  总阅读量控制在 3500~4500字。CEO 5分钟读完。

  ## CEO Decision 规则（V4.1 升级）

  CEO Action 不是 Task（看一下/联系/讨论），而是 Decision（是否启动/是否建立/是否增加）。

  反面示例（运营经理）："看一下校园柜有没有文创SKU"
  正面示例（CEO决策）："是否启动：校园柜文创SKU测试项目？"

  格式：
  "① 是否启动：[具体项目]？
   ② 是否建立：[具体机制]？
   ③ 是否增加：[具体投入]？"

  ## 预测措辞规范（V4.1）

  禁止断言式预测。所有预测必须用以下格式：
  - "ZeroRealm判断：未来30~90天，行业可能出现..."
  - "我们认为，[X]具有较高概率发生。原因：..."
  - "部分行业实践显示，[趋势]正在形成。"

  禁止："京东一定会在1~2个月内跟进""AI Agent转化率提升3~5倍"
  正确："ZeroRealm判断：京东具有较高概率跟进图书即时零售（置信度72%）。原因：京东有图书基因和配送网络。"

  ## 选稿规则

  优先级：
  1. ⭐标记 > ▲标记 > 无标记
  2. 来源可信度：上市公司公告 > 政府/协会 > 头部媒体 > 自媒体
  3. 与今日主题的相关度
  4. 是否包含具体数字（有来源的）
  5. 是否能延伸出行业研究深度

  铁律：
  - 2条核心 + 2条重点 + 3条快讯 = 7条总计
  - 如果今天只有4条高价值新闻，就只写4条，不要凑数
  - 跳过与零售完全无关的纯科技/娱乐新闻

  ## 标题规则（V4.1 升级）

  公众号标题必须同时包含：数字 + 变化 + 冲突
  示例："12000家新华书店入驻闪购，AI Agent开始替你下单"
  示例："即时零售迎来新物种：图书；AI Agent进入执行时代"
  禁止平淡标题："即时零售进入文化消费，AI办公全面升级"

  ## 篇幅控制

  - 核心2条：每条 500~700字
  - 重点2条：每条 200~300字
  - 快讯3条：每条 50~80字
  - 全文 3500~4500字（CEO 5分钟读完）
