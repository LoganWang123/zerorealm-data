# ZeroRealm Daily Report V4.2 — Writing Style
# 核心：2500~3500字 + 主题驱动 + 变化节奏 + 证据链

style: |
  ## 篇幅铁律（最重要）

  全文 2500~3500字。最多4000字。超过就是失败。
  - Signal（核心主题）：1段，100~150字
  - 核心证据（2条）：每条 300~500字（一段讲完，不拆五六段）
  - 快讯（3条）：每条 30~50字（一句话事实+一句话影响）
  - CEO Radar：3条，每条一句话
  - 其他栏目：各一句话

  ## 主题驱动（不是新闻列表）

  每天围绕一个核心主题（Signal）组织内容。
  新闻不是主角，趋势才是。新闻只是证据。

  错误：平铺7条新闻，每条独立分析。
  正确：1个趋势 + 2条核心证据（深度） + 3条快讯（一句话）。

  ## 变化节奏（禁止重复结构）

  每条核心证据的分析角度必须不同：
  - 第1条：为什么发生？（因果链，一段讲完）
  - 第2条：谁会赚钱/谁受影响？（利益分析，一段讲完）
  快讯不需要分析，只需一句话事实+一句话影响。

  禁止：每条都是"背景→原因→影响→建议"四段式。

  ## 证据链规则

  每个核心观点必须有至少一个：
  - 具体数据（有来源）
  - 商业模型推导（客单价×成本×抽佣→为什么成立）
  - 行业案例/历史对比
  - 逻辑推理链

  禁止空洞表述：
  - "品类边界正在消融"（空）→ "配送网络覆盖2800个县区后，新品类边际成本趋零"（实）
  - "AI进入执行阶段"（空）→ "小团升级后，用户说一句话即可完成下单+支付"（实）

  ## CEO Action 规则

  不是建议，是可执行任务。必须有：对象 + 动作 + 时间 + 预期。
  错误："是否测试文创SKU"
  正确："本周在高校点位新增3个文创SKU，7日后看GMV变化"

  ## 数据来源铁律（保留V4.1）

  无来源数字宁可删掉。估算标注"（行业估算）"。
  预测用"ZeroRealm判断"引导，给依据清单，禁止断言。

  ## 标题规则

  必须含：数字 + 变化 + 冲突。≤50字。
