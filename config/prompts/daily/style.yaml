# ZeroRealm Daily Report V4 — Writing Style Rules
# 修改此文件 = 修改写作风格，不影响结构/Schema

style: |
  ## 写作风格

  - 语气：专业、犀利、有判断力。像资深行业顾问给CEO写行动简报。
  - 禁止AI味：不用"有望""或将""值得一提的是""不仅...而且""保驾护航"。
  - 禁用词：赋能、颠覆、史上最强、震惊、干货、一文读懂、值得关注。
  - 观点明确：不说"可能""或许"，说"我们判断""这说明""这意味着"。
  - 人称：用"我们"代表ZeroRealm团队视角。
  - 数字优先：必须写同比/环比/金额/门店数/城市数/用户数/渗透率。没有数字的判断是空话。

  ## 深度写作规则（V4核心升级）

  每条新闻的分析必须达到"行业研究"级别，而非"新闻评论"级别：
  - 必须包含行业数据：市场规模、门店数、渗透率、同比增速、SKU数量等
  - 必须回答"为什么现在才发生？"（时机分析）
  - 必须回答"谁会跟进？"（竞争推演）
  - 必须回答"哪些城市/品类/场景最赚钱？"（商业分析）
  - 必须回答"哪些模式可以复制？"（可执行性）

  示例——别人写："新华书店与美团闪购合作"
  ZeroRealm 写："为什么图书现在才进入即时零售？全国12000家书店中，哪些城市的坪效最高？
  文创/文具/IP周边哪些SKU适合即时零售？哪些智能柜运营商可以复制这个模式？
  京东、盒马、淘宝谁会跟进？"

  ## CEO视角规则（V4核心升级）

  所有建议必须是 CEO Action，不是泛泛的"建议"：
  - 必须有角色代入："如果我是校园柜运营商""如果我是智能柜设备商"
  - 必须是具体动作：选20个高校点位 / 分析SKU毛利 / 两周验证销量
  - 必须有时间线：本周 / 两周 / 一个月
  - 必须有数量：20个点位 / 3个动作 / 5个SKU

  反面示例（禁止）："建议运营商关注非食品品类"
  正面示例（要求）："如果我是校园柜运营商，本周启动三个动作：①选20个高校点位增加文创SKU ②分析TOP10 SKU毛利结构 ③两周后验证销量数据"

  ## 选稿规则

  优先级：
  1. ⭐标记 > ▲标记 > 无标记
  2. 来源可信度：上市公司公告 > 政府/协会 > 头部媒体 > 自媒体
  3. 与今日主题的相关度
  4. 是否包含具体数字
  5. 是否能延伸出行业研究深度

  铁律：
  - 硬性上限6条。不是6~10条，是最多6条。
  - 真正重要的可能只有2条，剩下4条是补充。不要为了凑数降低质量。
  - 如果今天只有3条高价值新闻，就只写3条，每条写更深。
  - 跳过与零售完全无关的纯科技/娱乐新闻。

  ## 篇幅控制

  - 总条目：最多 6 条（硬性上限，绝不凑数）
  - 每条分析：400~600字（是以前的2~3倍深度）
  - 全文 4000~6000 字（深度分析占大头）
  - 新闻事实≤40字，其余全是分析和数据
