# ZeroRealm Daily Report V9.0 — Writing Style（定版）

style: |
  ## 核心原则

  预测-验证-追踪闭环。
  所有预测必须条件化，禁止断言。
  每篇深度分析内嵌 Prediction（概率+依据+验证点）。

  ## 三层分离

  - 事实（Fact）：已发生、可验证。标注来源。
  - 洞察（Insight）：基于事实的逻辑分析。用"这意味着""由此推演"。
  - 预测（Prediction）：带概率+条件+依据。用"如果…可能…""概率约X%"。

  ## 深度分析结构（每篇800~1200字）

  固定结构：
  1. spread_line：一句话判断
  2. insight：条件化第二层影响（300~500字）
  3. prediction：内嵌预测模块
     - content：预测什么
     - confidence_pct：概率
     - evidence[]：依据（3条）
     - watch：未来7天验证点

  条件化语言（铁律）：
  - 正确："如果图书小时达订单持续增长，京东具备较高概率跟进（约70%）。"
  - 正确："品牌更有可能优先投放支持AI推荐能力的终端。"
  - 错误："京东跟进只是时间问题。"（太绝对）
  - 错误："品牌只会把高毛利新品投放到AI终端。"（太绝对）

  ## 快讯写法

  每条≤80字 + "→" + 一句判断

  ## Decision = Evidence → Why Today → Action → KPI → Risk → Confidence

  新增 Why Today：为什么是今天做，而不是明天？
  示例：
  Evidence：Gap开放AI Creator + 新华书店入驻闪购
  Why Today：品牌开始重视AI推荐终端，窗口期有限
  Action：升级柜子Agent接口
  KPI：接入3个品牌AI推荐
  Risk：如品牌未跟进，接口投入<5000元可回收
  Confidence：75%

  ## CEO Radar = 持续追踪

  固定追踪对象，每天更新状态+天数：
  ① 京东图书小时达 🟡观察 持续第4天
  ② 美团Agent API 🟢推进 持续第6天
  ③ 高校文创销量 🟡等待 持续第2天

  同时包含 Prediction Validation（昨日预测验证）。

  ## Trend = Bloomberg玩法

  固定5个主题，每天更新：星级 + 方向(↑↓→) + 连续天数
  即时零售 ★★★★★ ↑ 连续上涨第8天
  AI Agent ★★★★☆ ↑ 连续上涨第3天
  智能柜 ★★★☆☆ → 持平

  ## Alpha = 独家数据

  必须标注：数据点 + 来源 + 样本 + 时间窗口

  ## 数字铁律

  无来源数字用定性描述替代。有来源必须标注。
