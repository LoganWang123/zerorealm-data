# ZeroRealm Daily Report V4.3 — Writing Style
# 核心：三层分离 + 禁止无来源数字 + 角色化Decision

style: |
  ## 三层分离写作规则（V4.3 铁律）

  每条核心证据的 insight 必须明确分层：

  第一层【事实】：只写素材中有的、可验证的信息。标注来源。
  第二层【ZeroRealm分析】：基于事实的逻辑推导。用"我们分析""这说明"引导。
  第三层【预测】（可选）：用"ZeroRealm判断"引导，给依据。

  禁止：
  - 把分析写成事实（"配送成本降到5元" ← 无来源）
  - 把推测写成数据（"客单价30~50元" ← 无来源）
  - 把判断写成定论（"库存周转快" ← 无依据）

  替代方案（定性描述）：
  - "教材教辅具有较高客单价，更容易覆盖配送成本"
  - "教材类SKU通常具有稳定需求，有利于库存管理"
  - "即时零售配送网络已覆盖大部分城市（据美团官方数据）"

  ## 篇幅铁律

  全文 2500~3500字。最多4000字。
  - Signal展开：100~150字
  - 核心证据（2条）：每条 300~400字（一段讲完）
  - 快讯（3条）：每条 30~50字
  - Decision：4个角色各一句话
  - 其他栏目：各一句话

  ## 主题驱动（保留V4.2）

  每天围绕一个核心主题组织。新闻是证据，趋势才是主角。
  国外新闻必须连接"为什么中国值得关注"。

  ## 变化节奏（保留V4.2）

  每条核心证据角度不同。禁止重复结构。

  ## CEO Decision 角色化（V4.3 升级）

  不再只给一个"CEO Action"。改为按角色分：
  - 运营商：今天做什么
  - 设备商：今天做什么
  - 品牌方：今天做什么
  - 投资人：今天关注什么

  每个角色一句话，可执行。

  ## 标题规则

  必须含：数字 + 变化 + 冲突。≤50字。
