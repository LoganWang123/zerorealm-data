# ZeroRealm Daily Report V4.4 — Output Schema
# 核心：咨询级洞察 + First Principle + Why It Matters + 品牌栏目

schema: |
  ## 日报结构（严格按此顺序）

  1. **wechat_title**: 标题（数字+变化+冲突，≤50字）
  2. **signal_no**: Signal编号（渲染为 #004）
  3. **signal**: ZeroRealm Signal（一句话核心主题，≤40字）
  4. **ceo_radar**: ZeroRealm Radar（3条，本周必须关注）
  5. **decision**: ZeroRealm Decision（角色化）
     - operators / device_makers / brands / investors（各一句话）
  6. **trend**: Signal展开（100~150字，三层分离）
  7. **industry_temp**: ZeroRealm Index（0~100，5维度）
  8. **sections**: 证据（2条核心 + 3条快讯）
     核心（2条）：
     - title / excerpt / level:"core" / angle
     - why_it_matters: 一句话说明为什么重要（V4.4新增）
     - insight: 300~400字，咨询级洞察，必须有"别人没提到"的新观点
     - importance / confidence / action / impact / tags / source
     快讯（3条）：
     - title / excerpt(≤50字) / level:"quick" / tags / source
  9. **first_principle**: ZeroRealm Principle（V4.4新增）
     - no: 编号（如18）
     - content: 一句话行业底层规律
  10. **opportunity**: 今日机会（一句话）
  11. **risk**: 今日风险（一句话）
  12. **one_chart**: ZeroRealm Chart（文本柱状图）
  13. **data_point**: One Number
  14. **prediction**: ZeroRealm Prediction
     - content / confidence_pct / evidence[] / risk_note
  15. **counter_view**: ZeroRealm Counter View
  16. **watchlist**: ZeroRealm Watchlist（3~5个）
  17. **discussion**: 互动（挑衅性问题，不是选择题）
  18. **exclusive_data**: 监测数据
  19. **tomorrow**: 明日关注

  ## V4.4 关键变更

  - 新增 first_principle（ZeroRealm Principle #XXX）
  - 新增 why_it_matters（每条核心证据一句话）
  - insight 必须是咨询级（别人没想到的观点）
  - discussion 改为挑衅性问题（不是选择题）
  - 所有栏目品牌化（ZeroRealm前缀）
