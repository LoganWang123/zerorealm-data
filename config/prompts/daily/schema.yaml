# ZeroRealm Operator Brief V11.0 — 输出结构

schema: |
  ## 固定结构

  1. wechat_title：具体主体 + 已发生变化 + 待检查经营指标
  2. signal_no / signal：一句由正文证据直接支持的经营判断
  3. sections：
     - core 恰好 1 条
     - quick 0~2 条
     - 每条都保留素材中的直接 HTTP(S) 原文链接
  4. decision.operators：
     - evidence：直接事实
     - metric：一个经营指标
     - action：一个低成本、可逆动作
     - sample：小样本范围和观察天数
     - kpi：7~14 天可观察结果
     - stop_condition：停止或回退条件
  5. tomorrow：下一期需要验证的一个事实
  6. reader_prompt：邀请读者回复柜机数量和本期指标

  不输出 summary、ceo_radar、trend、alpha、data_corner、预测概率，
  也不输出设备商、品牌方或投资人的决策。
