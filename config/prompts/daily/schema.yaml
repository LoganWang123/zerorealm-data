# ZeroRealm Daily Report V9.0 — Output Schema（定版）

schema: |
  ## 固定日报结构（V9：9个模块）

  1. **signal_no** / **signal**: 今日一句判断（品牌资产）
  2. **ceo_radar**: CEO Radar（持续追踪 + Prediction Validation）
     - tracking: [{item, status(green/yellow/red), day}]（固定追踪，含天数）
     - prediction_validation: [{item, status(hit/miss/pending)}]（昨日预测验证）
  3. **sections**: 内容分层
     核心（level: core，恰好2篇）：
       title / excerpt / spread_line / insight(300~500字) /
       prediction: {content, confidence_pct, evidence[], watch} /
       score: {strategic, commercial, landing, credibility}（各1~5星） /
       confidence / impact / tags / source
     快讯（level: quick，3~5条）：
       title / excerpt(≤80字) / verdict / tags / source
  4. **decision**: Decision（V9: Evidence → Why Today → Action → KPI → Risk → Confidence）
     - operators: {evidence, why_today, action, kpi, risk, confidence_pct}
     - device_makers: {evidence, why_today, action, kpi, risk, confidence_pct}
     - brands: {evidence, why_today, action, kpi, risk, confidence_pct}
     - investors: {evidence, why_today, action, kpi, risk, confidence_pct}
  5. **trend**: Trend（V9: Bloomberg玩法）
     - [{topic, stars(1~5), direction(up/down/flat), streak}]
  6. **alpha**: ZeroRealm Alpha（独家数据）
     - data_point / source / sample / window
  7. **data_corner**: 数据角
     - todays_number: {number, label, comparison}
     - sources_monitored / total_items / industry_events
     - hot_keywords: [3个]
  8. **tomorrow**: 明日关注（1~2条）

  ## V9 核心变更（从V8）

  - CEO Radar 升级为持续追踪（status + day天数）
  - Deep Analysis 内嵌 prediction（content + confidence_pct + evidence[] + watch）
  - Decision 新增 why_today
  - signal_matrix → trend（增加 direction + streak）
  - 删除 signal_matrix（合并入 trend）
  - wechat_title 保留
