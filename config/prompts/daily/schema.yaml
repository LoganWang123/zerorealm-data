# ZeroRealm Daily Report V4.1 — Output Schema
# 修改此文件 = 修改输出结构，不影响写作风格/Insight模板
# V4.1: CEO Decision + 影响对象 + Signal#003 + 2+2+3结构 + 置信度百分比

schema: |
  ## 日报结构（严格按此顺序输出）

  1. **wechat_title**: 公众号标题
     必须同时包含：数字 + 变化 + 冲突
     示例："12000家新华书店入驻闪购，AI Agent开始替你下单"
     示例："即时零售迎来新物种：图书；AI Agent进入执行时代"
     要求：≤50字，含SEO关键词，不用"No.X"

  2. **signal_no**: ZeroRealm Signal 编号（整数，渲染为三位数 #003）

  3. **ceo_action**: CEO今日决策（3个Decision，不是Task）
     格式：是否启动/是否建立/是否增加
     示例：
     - "是否启动：校园柜文创SKU测试项目？"
     - "是否建立：AI Agent接口预研小组？"
     - "是否增加：高校点位密度？"

  4. **trend**: 今日趋势（100~200字，含数据支撑，数据必须有来源）

  5. **industry_temp**: 行业温度（0~100分）
     - ai_retail / instant_retail / smart_cabinet / funding / policy
     计算规则：每条相关新闻基础分15，A级×2，B级×1.5，上限100

  6. **summary**: 今日三分钟（恰好3条，每条≤25字，动词开头）

  7. **sections**: 精选资讯（2+2+3结构）
     统一列表，每条包含：
     - title: ≤30字
     - excerpt: 事实（核心/重点≤60字，快讯≤30字）
     - level: core/important/quick（核心/重点/快讯）
     - angle: 分析角度（仅核心/重点需要）
     - insight: 深度分析（核心500~700字，重点200~300字，快讯无）
     - importance: A/B/C
     - confidence: High/Medium/Low
     - action: immediate/this_week/observe
     - impact: 影响对象（仅核心/重点）
       - operators: 1~5
       - device_makers: 1~5
       - brands: 1~5
       - investors: 1~5
     - tags: {industry, topics}
     - source_url / source_name

  8. **exclusive_data**: ZeroRealm 独家监测（真实系统数据）
     - sources_monitored / total_items / industry_events
     - funding_events / partnership_events / new_products
     - hot_keywords（3~5个）
     - one_line（一句话总结）

  9. **data_point**: 今日数据（1个关键数字 + 解读，数字必须有来源）

  10. **prediction**: 未来30~90天预测
      - content: 用"ZeroRealm判断"引导，禁止断言
      - confidence_pct: 置信度百分比（如72）
      - basis: 预测依据

  11. **counter_view**: 不同视角（每期固定1条，品牌IP）

  12. **signal**: ZeroRealm Signal（一句话，≤40字，品牌IP）

  13. **discussion**: 今日互动（选择题格式，①②③④）

  14. **tomorrow**: 明日关注（1~2个事件）

  ## V4.1 关键变更

  - ceo_action: Task → Decision（是否启动/建立/增加）
  - sections: 新增 level 字段（core/important/quick）
  - sections: 新增 impact 字段（影响对象 1~5星）
  - prediction: confidence → confidence_pct（百分比）
  - signal_no: 渲染为三位数 #003（不是 No.3）
  - wechat_title: 必须含 数字+变化+冲突
