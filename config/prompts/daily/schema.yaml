# ZeroRealm Daily Report V4.3 — Output Schema
# 核心：Signal→Insight→Decision + 角色化 + Watchlist + 三层分离

schema: |
  ## 日报结构（严格按此顺序）

  1. **wechat_title**: 标题（数字+变化+冲突，≤50字）
  2. **signal_no**: Signal编号（渲染为 #004）
  3. **signal**: 今日Signal（一句话核心主题，≤40字）
  4. **ceo_radar**: CEO Radar（3条，本周必须关注）
  5. **decision**: 角色化Decision（V4.3核心升级）
     - operators: 运营商今天做什么（一句话，可执行）
     - device_makers: 设备商今天做什么
     - brands: 品牌方今天做什么
     - investors: 投资人今天关注什么
  6. **trend**: Signal展开（100~150字）
  7. **industry_temp**: 行业温度（0~100，5维度）
  8. **sections**: 证据（2条核心 + 3条快讯）
     核心（2条）：
     - title / excerpt / level:"core" / angle
     - insight: 300~400字，必须三层分离（事实→分析→预测）
     - importance / confidence / action / impact / tags / source
     快讯（3条）：
     - title / excerpt(≤50字) / level:"quick" / tags / source
  9. **opportunity**: 今日机会（一句话）
  10. **risk**: 今日风险（一句话）
  11. **one_chart**: 一张图（文本柱状图）
  12. **data_point**: One Number（1个数字+一句话）
  13. **prediction**: 预测（ZeroRealm判断 + 依据清单 + 置信度 + 风险）
  14. **watchlist**: 本周监控名单（3~5个企业/事件）
  15. **counter_view**: 反面观点（1条）
  16. **discussion**: 互动（选择题）
  17. **exclusive_data**: 监测数据
  18. **tomorrow**: 明日关注

  ## V4.3 关键变更

  - decision: 角色化（运营商/设备商/品牌/投资人各一句话）
  - insight: 强制三层分离（事实→分析→预测）
  - 新增 watchlist（本周监控名单）
  - 数字铁律：无来源数字用定性描述替代
  - 国外新闻必须连接"为什么中国值得关注"
