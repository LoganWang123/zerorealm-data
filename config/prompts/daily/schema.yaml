# ZeroRealm Daily Report V4.2 — Output Schema
# 核心：主题驱动 + CEO Radar + Opportunity/Risk + One Chart

schema: |
  ## 日报结构（严格按此顺序）

  1. **wechat_title**: 标题（数字+变化+冲突，≤50字）

  2. **signal_no**: Signal编号（整数，渲染为 #003）

  3. **signal**: 今日Signal（一句话核心主题，≤40字，品牌IP）
     这是每天最重要的一句话。所有新闻都是它的证据。

  4. **ceo_radar**: CEO Radar（3条，每条一句话，本周必须关注）
     格式：一句话，具体事件/节点
     示例：
     - "京东是否上线图书小时达"
     - "AI Agent开放API时间表"
     - "高校文创SKU首周销量"

  5. **ceo_action**: CEO今日任务（1~2条，可执行任务）
     必须有：对象+动作+时间+预期
     示例："本周在高校点位新增3个文创SKU，7日后看GMV变化"

  6. **trend**: Signal展开（100~150字，解释为什么这是今天的主题）

  7. **industry_temp**: 行业温度（0~100，5个维度）

  8. **sections**: 证据（2条核心 + 3条快讯）
     核心（2条）：
     - title / excerpt / level:"core" / angle
     - insight: 300~500字（一段讲完，不拆多段）
     - importance / confidence / action / impact / tags / source
     快讯（3条）：
     - title / excerpt(≤50字) / level:"quick"
     - insight: ""（无分析）
     - importance:"C" / tags / source

  9. **opportunity**: 今日机会（一句话）
     示例："高校文创柜：即时零售+高频客流+高毛利，窗口期约3个月"

  10. **risk**: 今日风险（一句话）
     示例："非食品SKU库存周转可能下降，需设退货率预警线"

  11. **one_chart**: 一张图（文本柱状图，5~7行）
     示例：
     title: "即时零售品类渗透进度"
     rows:
       - label: "餐饮" value: 90
       - label: "生鲜" value: 70
       - label: "医药" value: 55
       - label: "图书" value: 20
       - label: "文创" value: 10

  12. **data_point**: One Number（1个数字+一句话为什么重要）

  13. **prediction**: 预测（ZeroRealm判断 + 依据清单 + 置信度）
     - content: "ZeroRealm判断：..."
     - confidence_pct: 72
     - evidence: ["京东图书全国库存", "达达配送网络", "已布局小时达"]
     - risk_note: "如果图书GMV不达标，可能不会推广"

  14. **counter_view**: 反面观点（1条，品牌IP）

  15. **discussion**: 互动（选择题 ①②③④）

  16. **exclusive_data**: 监测数据（真实系统统计）

  17. **tomorrow**: 明日关注（1~2条）

  ## V4.2 关键变更

  - 主题驱动：Signal → Evidence → Impact → Action
  - 篇幅：2500~3500字（硬性）
  - 新增：ceo_radar / opportunity / risk / one_chart
  - 核心证据只有2条（不是6~7条）
  - 快讯3条（一句话，无分析）
  - prediction新增evidence清单和risk_note
