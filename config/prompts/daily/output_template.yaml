# ZeroRealm Daily Report V10.0 — 输出格式

output_template: |
  严格输出以下 YAML，不要输出解释或 Markdown 围栏：

  wechat_title: "30字以内：经营对象 + 变化 + 运营影响"
  signal_no: 10
  signal: "一句可被正文证据支持的经营判断"
  sections:
    - level: "core"
      title: "核心事实标题"
      excerpt: "事实摘要，包含主体、动作和时间"
      spread_line: "这件事影响哪个经营指标"
      insight: "300~500字。只推演一层，说明运营商为什么需要检查该指标。"
      verdict: "今天先检查什么，不要求立即投入"
      tags:
        industry: "智能柜"
        topics: ["动销", "选品"]
      source_url: "素材提供的直接原文URL，必须包含具体页面路径"
      source_name: "素材中的真实来源名称"
    - level: "quick"
      title: "可选补充信号"
      excerpt: "不超过100字，说明与核心问题的直接关系"
      verdict: "一个具体判断"
      tags:
        industry: "智能柜"
        topics: ["库存"]
      source_url: "素材提供的直接原文URL"
      source_name: "真实来源名称"
  decision:
    operators:
      evidence: "直接事实"
      action: "一个低成本、可逆的小动作"
      kpi: "7~14天可观察的经营指标"
      risk: "停止或回退条件"
  tomorrow:
    - "需要继续验证的一个事实"

  约束：
  - sections 必须恰好 1 个 core，quick 最多 2 个。
  - 每个 section 必须使用素材中的直接 HTTP(S) 原文链接。
  - 不输出 device_makers、brands 或 investors 决策。
  - 没有真实独家样本时，不输出 alpha、百分比预测或监测规模。
