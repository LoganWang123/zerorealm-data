# ZeroRealm Daily Report V4.1 — Insight System (Angle Rotation)
# 修改此文件 = 修改洞察写作体系，不影响其他模块
# V4.1: 强化数据可信度 + 预测措辞规范 + 影响对象

insight: |
  ## Insight 角度轮换制（保留V4）

  【禁止】不再使用固定的【判断】【证据】【原因】【影响】【建议】五步模板。

  【要求】每条核心/重点新闻使用不同的分析角度，按顺序轮换：

  第1条角度：为什么发生？（因果链分析）
  第2条角度：谁最受影响？（利益相关方分析）
  第3条角度：三个月后会怎样？（趋势推演）
  第4条角度：谁会赚钱？（商业模型分析）
  第5条角度：谁应该行动？（CEO Decision）
  第6条角度：反面思考（Counter View）

  注意：快讯不需要角度分析，只需一句话事实+一句话影响。

  ## 数据可信度规则（V4.1 铁律）

  每条 insight 中的数据必须遵守：
  - 有来源的数字：直接引用，标注来源（如"据CCFA数据"）
  - 无来源的数字：绝不编造，用定性描述替代
  - 估算数字：必须标注"（行业估算，未经验证）"
  - 对比数据：必须有明确出处

  禁止出现的表述：
  - "增速180%""增长616%"（无来源的具体增速）
  - "GMV超200亿"（无来源的具体金额）
  - "占比12%"（无来源的具体占比）
  - "转化率提升3~5倍"（无来源的具体倍数）

  替代方案：
  - "增速领先""大幅增长""显著提升"（定性描述）
  - "据[来源]数据，[具体数字]"（有来源引用）
  - "（行业估算，未经验证）"（标注不确定）

  ## 预测措辞规范（V4.1）

  所有预测/判断必须用以下格式，禁止断言：

  正确格式：
  - "ZeroRealm判断：未来30~90天，[X]具有较高概率出现。"
  - "我们认为，[趋势]正在形成。依据：..."
  - "部分行业实践显示，[现象]。"

  禁止格式：
  - "京东一定会在1~2个月内跟进"（断言）
  - "AI Agent转化率提升3~5倍"（无来源数字）
  - "必将""必然""肯定"（绝对化用语）

  ## 影响对象标注（V4.1 新增）

  每条核心/重点新闻必须标注影响对象及程度：
  - operators: 运营商影响（1~5星）
  - device_makers: 设备商影响（1~5星）
  - brands: 品牌方影响（1~5星）
  - investors: 投资人影响（1~5星）

  示例：
  operators: 5  （运营商高度相关）
  device_makers: 4
  brands: 3
  investors: 2

  ## CEO Decision 写法（V4.1 升级）

  当角度为"谁应该行动"时，写 Decision 而非 Task：

  格式：
  "CEO Today：
  ① 是否启动：[具体项目]？（背景：...）
  ② 是否建立：[具体机制]？（原因：...）
  ③ 是否增加：[具体投入]？（依据：...）"

  示例：
  "CEO Today：
  ① 是否启动：校园柜文创SKU测试项目？（背景：即时零售品类边界正在消融）
  ② 是否建立：AI Agent接口预研小组？（原因：美团小团已支持交易闭环）
  ③ 是否增加：高校点位密度？（依据：高校周边文创毛利率显著高于均值）"

  ## 置信度标注

  每条新闻必须标注 confidence:
  - High: 上市公司公告、政府文件、协会官方数据
  - Medium: 头部媒体报道、多方交叉验证
  - Low: 单一来源、未经证实、自媒体爆料

  ## Action Priority

  每条新闻必须标注 action:
  - immediate: 需要立即决策（今天）
  - this_week: 本周关注/评估
  - observe: 持续跟踪，暂不行动
