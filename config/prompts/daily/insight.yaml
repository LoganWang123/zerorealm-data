# ZeroRealm Daily Report V4 — Insight System (Angle Rotation)
# 修改此文件 = 修改洞察写作体系，不影响其他模块
# V4核心变更：打破固定五步模板，改为"角度轮换制"

insight: |
  ## Insight 角度轮换制（V4核心升级）

  【禁止】不再使用固定的【判断】【证据】【原因】【影响】【建议】五步模板。
  连续6条相同结构 = AI味 = 读者疲劳。

  【要求】每条新闻使用不同的分析角度，按顺序轮换：

  第1条角度：为什么发生？（因果链分析）
  - 追溯根因，不是表面原因
  - 回答"为什么是现在？为什么不是去年？"
  - 用数据支撑因果链

  第2条角度：谁最受影响？（利益相关方分析）
  - 列出3~5个利益相关方
  - 分析谁受益、谁受损、谁被边缘化
  - 量化影响程度

  第3条角度：三个月后会怎样？（趋势推演）
  - 基于当前信号推演未来
  - 给出最可能的情景（不是幻想）
  - 标注关键变量和转折点

  第4条角度：谁会赚钱？（商业模型分析）
  - 分析价值链上谁获利最大
  - 计算市场空间和利润率
  - 指出可复制的商业模式

  第5条角度：谁应该行动？（CEO Action Plan）
  - 角色代入："如果我是XX运营商"
  - 给出3个具体动作（含数量、时间线）
  - 必须是本周可启动的

  第6条角度：反面思考（Counter View）
  - 当市场一致看好时，指出风险
  - 当市场悲观时，指出机会
  - 这是 ZeroRealm 的品牌标志

  注意：如果当天只有3~4条新闻，按顺序取前3~4个角度即可。

  ## 写作格式

  每条 insight 用自然段落写作，不用固定标签。可以包含：
  - 小标题（如"为什么是现在？""谁会跟进？"）
  - 数据引用（"全国即时零售过去一年新增品类：文创、鲜花、药品、图书、潮玩"）
  - 对比分析（"去年 vs 今年""中国 vs 日本"）
  - 具体案例（"以XX品牌为例"）
  - CEO Action（"如果我是XX，本周会：①②③"）

  每条 insight 长度：400~600字。必须比新闻事实长10倍以上。

  ## CEO Action 写法规范

  当角度为"谁应该行动"时，必须严格按此格式：

  "如果我是[具体角色]，本周会启动[N]个动作：
  ① [具体动作+数量]（[时间线]）
  ② [具体动作+数量]（[时间线]）
  ③ [具体动作+数量]（[时间线]）"

  示例：
  "如果我是校园智能柜运营商，本周会启动三个动作：
  ① 选20个高校点位，增加文创和IP周边SKU（本周完成选点）
  ② 分析现有TOP10 SKU毛利结构，找出可替换的低效品（3天内）
  ③ 两周后验证新品销量，决定是否扩大铺货（第14天复盘）"

  ## 置信度标注

  每条新闻必须标注 confidence:
  - High: 上市公司公告、政府文件、协会官方数据
  - Medium: 头部媒体报道、多方交叉验证
  - Low: 单一来源、未经证实、自媒体爆料

  ## Action Priority

  每条新闻必须标注 action:
  - immediate: 需要立即行动（本周内）
  - this_week: 本周关注/评估
  - observe: 持续跟踪，暂不行动

  ## 行业数据要求

  每条 insight 必须包含至少2个行业数据点：
  - 门店数/设备数/点位数
  - 市场规模/增速/渗透率
  - SKU数量/品类数/毛利率
  - 融资额/估值/投资方数量
  - 用户数/订单量/客单价

  如果素材中没有数据，基于行业常识给出合理估算，并标注"（行业估算）"。
