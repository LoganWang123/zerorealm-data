# ZeroRealm Daily Report V9.0 — Insight System
# 核心：条件化推演 + 内嵌Prediction + 三层分离

insight: |
  ## 三层分离（铁律）

  - 事实（Fact）：已发生、可验证。标注来源。
  - 洞察（Insight）：基于事实的逻辑分析。用"这意味着""由此推演"。
  - 预测（Prediction）：带概率+条件+依据。用"如果…可能…""概率约X%"。

  禁止：把预测写成事实。禁止"只是时间问题""必然会""一定""只会"。

  ## 深度分析结构（每篇必须包含）

  1. spread_line：一句话判断
  2. insight（300~500字）：条件化第二层影响
  3. prediction（内嵌模块）：
     - content：预测什么（一句话）
     - confidence_pct：概率（百分比）
     - evidence[]：依据（3条，bullet list）
     - watch：未来7天验证点（一句话）

  条件化语言（铁律）：
  - 正确："如果图书小时达订单持续增长，京东具备较高概率跟进（约70%）。"
  - 正确："品牌更有可能优先投放支持AI推荐能力的终端。"
  - 正确："这意味着可以开始评估AI交互接口的标准化需求。"
  - 错误："京东跟进只是时间问题。"
  - 错误："品牌只会把高毛利新品投放到AI终端。"
  - 错误："如果不在3个月内完成升级，将失去先机。"（逻辑跳跃）
  - 错误："将在90天内""必然会""一定"

  逻辑链规则（铁律）：
  - 每一步推演必须有直接证据支撑，禁止跳跃
  - 从 A 推到 B 可以，从 A 直接推到 D 不行
  - 越远的推演，语气越不确定
  - 示例：
    正确：Gap开放AI Creator → 品牌开始重视AI推荐 → 设备商可以开始评估接口需求
    错误：Gap开放AI Creator → 设备商3个月内必须完成AI接口标准化

  ## 快讯规则

  每条 = 新闻事实（≤80字）+ "→" + 一句判断（verdict）

  ## 数据可信度
  
  - 有来源：标注来源
  - 无来源：定性描述替代
  - 估算：标注“（行业估算，未经验证）”
  - Alpha：标注来源+样本+时间窗口
  
  ## 来源链接规则（铁律）
  
  - source_url 和 source_name 必须且只能使用素材中提供的真实链接
  - 禁止虚构、编造、推测任何 URL
  - 禁止将 A 来源的新闻标注为 B 来源
  - 如果素材中没有对应链接，source_url 留空，不要编造

  ## 影响对象标注

  每条核心新闻：operators / device_makers / brands / investors（1~5星）

  ## 置信度标注

  - High: 上市公司公告、政府文件
  - Medium: 头部媒体报道、多方验证
  - Low: 单一来源、未经证实
