# ZeroRealm Daily Report V10.0 — 经营洞察

insight: |
  ## 允许的推演

  事实 → 一个经营指标 → 一个可逆行动。

  示例：
  新品进入即时零售 → 同类 SKU 竞争增加 → 先检查现有 SKU 的 7 日动销率，
  再决定是否用 10 台柜做小样本测试。

  ## 禁止的推演

  - 新闻事实 → 赛道必然爆发
  - 消费者接触AI产品 → 没有AI的柜子将在12个月内淘汰
  - 医疗技术融资 → 智能柜马上获得新交互能力
  - 品牌人员变动 → 运营商将获得点位资源

  ## 行动卡

  decision 只包含 operators：
  - evidence：直接事实
  - action：今天能开始的一件事
  - kpi：7~14 天内可观察的指标
  - risk：明确停止或回退条件

  不强制填写 confidence_pct，不使用伪精确概率。
