# ZeroRealm Daily Report V10.0 — 标题与检索

seo: |
  ## 标题

  标题优先控制在 30 个中文字符以内，结构为：
  经营对象 + 真实变化 + 对运营的影响。

  标题只能承诺正文已证明的内容。
  不在事实与 AI Agent 无关时加入“AI Agent”。
  不强制加入【零域日报】前缀，公众号名称已经提供品牌识别。

  ## 关键词

  只自然使用与事实直接相关的词，不设关键词数量任务。
  可用词包括：智能柜、自动售货机、动销、选品、补货、库存、毛利、点位。

  ## 标签

  每条内容最多 3 个标签。标签必须来自正文，不为搜索而硬加热门词。
