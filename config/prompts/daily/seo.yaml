# ZeroRealm Daily Report V7.0 — SEO & Keywords

seo: |
  ## 微信SEO关键词（自然融入正文）

  每篇至少自然出现以下关键词中的5个：
  智能柜、自动售货机、无人零售、即时零售、AI零售、新零售、
  数字化运营、零售科技、AI Agent、智能零售终端

  ## 品牌IP关键词（V7：只保留3个）

  每篇必须包含：
  - "ZeroRealm Signal #XXX"（每日一句判断）
  - "ZeroRealm Decision"（每日行动）
  - "ZeroRealm Insight"（深度分析）
  - "零域日报"（中文品牌名）

  禁止出现：
  - ZeroRealm Prediction / Watchlist / Index / Principle / Exclusive / Radar / Lens
  这些概念保留，但不加品牌前缀。

  ## 标题SEO规则

  - 必须包含【零域日报】品牌前缀
  - 必须包含至少1个核心关键词
  - ≤50字

  ## Tags 两层结构

  一级（industry）：智能柜 / 即时零售 / 无人零售 / 便利店 / 供应链 / 品牌
  二级（topics）：AI Agent / SKU / 点位 / 融资 / 政策 / 数字化运营 / 零售科技 / 出海 / 品类扩张 / 文创

  每条新闻必须标注 1个industry + 1~2个topics。
