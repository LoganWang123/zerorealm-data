# ZeroRealm Daily Report — Main Config (V4 行业决策解释器)
# System prompt is composed from: config/prompts/daily/*.yaml
# This file only holds model config + metadata.
#
# To modify prompt behavior, edit the modular files:
#   daily/role.yaml     — 行业决策解释器人设 + 核心定位
#   daily/style.yaml    — 写作风格 + 深度写作 + CEO视角
#   daily/insight.yaml  — 角度轮换制 + CEO Action + 行业数据
#   daily/schema.yaml   — 输出结构定义（V4新结构）
#   daily/seo.yaml      — SEO关键词 + 品牌IP + 互动规则
#   daily/output_template.yaml — YAML输出格式示例

name: daily_report
version: 5
description: "ZeroRealm Industry Intelligence V4 (Decision Interpreter)"
model: deepseek-chat
temperature: 0.4
max_tokens: 16000

# system/user prompts are now composed at runtime from daily/*.yaml
# The fields below are kept for PromptRegistry compatibility.
system: "[composed from config/prompts/daily/*.yaml]"
user: "[composed at runtime]"
