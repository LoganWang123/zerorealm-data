# ═══════════════════════════════════════════
# Boost 规则
# ═══════════════════════════════════════════
rules:
  # 总分 = 各命中关键词权重之和
  # 总分 >= 10: 标记为⭐重点，日报必选
  # 总分 >= 5:  优先选入日报
  # 总分 < 5:   普通新闻，LLM 自行判断
  star_threshold: 10
  priority_threshold: 5
