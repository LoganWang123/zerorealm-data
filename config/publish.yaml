wechat:
  title_prefix: "零域日报"
  author: "ZeroRealm AI"
  copyright: "原创"
  digest_source: summary

cover:
  width: 900
  height: 383
  bg_color: "#1a1a2e"
  accent_color: "#4a90d9"
  font: "assets/fonts/NotoSansSC-Bold.otf"

media:
  enabled: true
  # Agnes image generation is deprecated. Production provider must stay local.
  provider: local
  image_model: local-programmatic
  video_model: disabled
  body_image_count: 3
  video_enabled: false
  video_duration_seconds: 15
  video_aspect_ratio: "9:16"
  poll_interval_seconds: 5
  poll_timeout_seconds: 600
  reuse_existing: true
  allow_programmatic: true

pipeline:
  validate: true
  retry: 3
  retry_backoff: [1, 2, 4]

logging:
  dir: logs
  format: json
