version: 1
language: zh-CN

tone:
  - 专业
  - 克制
  - 实务
  - 非营销

preferred:
  - 具体经营问题
  - 数据边界明确
  - 来源清楚
  - 事实和判断分开
  - 对运营人员有可执行价值
  - 短段落
  - 少空话

avoid:
  - 宏大叙事
  - AI 宣传腔
  - 未经证据的趋势预测
  - 赋能
  - 重塑
  - 颠覆
  - 新时代
  - 值得期待
  - 堆砌行业术语
  - 过度绝对化

ai_style_patterns:
  - "值得注意的是"
  - "不难发现"
  - "从某种意义上说"
  - "可以预见"
  - "随着……不断发展"
  - "在这个背景下"
  - "事实上"
  - "本质上"
  - "换句话说"
  - "这意味着"
  - "未来值得期待"
  - "随着科技不断发展"
  - "未来我们拭目以待"

opening_forbid_patterns:
  - "随着科技不断发展"
  - "随着……的不断发展"
  - "在数字化浪潮"
  - "在新零售时代"

closing_forbid_patterns:
  - "未来我们拭目以待"
  - "值得期待"
  - "让我们拭目以待"

daily:
  principle: ONE_SIGNAL
  structure:
    - 发生了什么
    - 为什么值得关注
    - 当前证据能说明什么
    - 不能说明什么
    - 经营上要看哪个指标

insight:
  structure:
    - 问题
    - 证据
    - 机制
    - 经营含义
    - 限制
    - 可验证建议

golden_benchmark:
  slug: smart-cabinet-five-process-metrics
  content_type: insight
  traits:
    - 问题导向
    - 经营视角
    - 指标明确
    - 少宏大判断
    - 不伪造数字
    - 边界清楚
