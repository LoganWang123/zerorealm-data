[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Existing low-risk cleanup is tracked as technical debt. Keep CI focused on
# syntax errors and undefined names while that baseline is reduced gradually.
ignore = ["E402", "F401", "F541", "F841"]
